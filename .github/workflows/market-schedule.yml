name: Market brief and review

on:
  schedule:
    # JST weekdays 07:30 (UTC previous day 22:30).
    - cron: '30 22 * * 0-4'
    # JST weekdays 17:00.
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: Morning or evening
        type: choice
        options: [morning, evening]
        default: morning
      notes:
        description: Optional evening notes
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: market-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Select mode and Japan date
        id: context
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            mode="$REQUESTED_MODE"
          elif [ "$SCHEDULE" = "30 22 * * 0-4" ]; then
            mode=morning
          else
            mode=evening
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"
      - name: Generate morning brief
        if: steps.context.outputs.mode == 'morning'
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
        run: python fetch_market_data.py
      - name: Save morning context
        if: steps.context.outputs.mode == 'morning'
        uses: actions/upload-artifact@v4
        with:
          name: morning-${{ steps.context.outputs.date }}
          path: |
            market_summary.json
            morning_brief_latest.md
            morning_context.json
          if-no-files-found: error
          retention-days: 14
      - name: Find today's successful morning run
        if: steps.context.outputs.mode == 'evening'
        id: morning
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/find_morning_artifact.py
      - name: Restore morning context
        if: steps.context.outputs.mode == 'evening'
        uses: actions/download-artifact@v5
        with:
          name: morning-${{ steps.context.outputs.date }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.morning.outputs.run_id }}
      - name: Generate review and upload knowledge
        if: steps.context.outputs.mode == 'evening'
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DATASET_API_KEY: ${{ secrets.DATASET_API_KEY }}
          DATASET_ID: ${{ secrets.DATASET_ID }}
          REVIEW_NOTES: ${{ inputs.notes }}
        run: python verify_and_learn.py --non-interactive --notes "$REVIEW_NOTES"
      - name: Save evening report
        if: always() && steps.context.outputs.mode == 'evening'
        uses: actions/upload-artifact@v4
        with:
          name: evening-${{ steps.context.outputs.date }}
          path: evening_review_*.md
          if-no-files-found: ignore
          retention-days: 30
